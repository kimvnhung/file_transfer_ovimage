version: '3.8'

services:
  android-ci:
    build:
      context: .
      dockerfile: docker/Dockerfile.android-ci
    container_name: file_transfer_ci
    volumes:
      - .:/workspace
      - android-sdk-cache:/opt/android-sdk
      - qt-cache:/opt/Qt
      - opencv-cache:/opt/opencv
      - gradle-cache:/root/.gradle
    environment:
      - ANDROID_HOME=/opt/android-sdk
      - ANDROID_NDK=/opt/android-sdk/ndk/27.2.12479018
      - QT_VERSION=6.10.0
      - OPENCV_VERSION=4.10.0
      - ANDROID_ABI=arm64-v8a
      - BUILD_TYPE=Release
    command: /usr/local/bin/build-android.sh

volumes:
  android-sdk-cache:
  qt-cache:
  opencv-cache:
  gradle-cache:
