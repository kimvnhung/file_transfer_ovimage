name: Android CI - Build and Test

on:
  push:
    branches: [ main, dev_with_ai_agent ]
  pull_request:
    branches: [ main, dev_with_ai_agent ]
  workflow_dispatch:

env:
  QT_VERSION: '6.10.0'
  ANDROID_API_LEVEL: 23
  ANDROID_BUILD_TOOLS_VERSION: 34.0.0
  ANDROID_NDK_VERSION: '27.2.12479018'
  OPENCV_VERSION: '4.10.0'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a]  # Can add: armeabi-v7a, x86, x86_64
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK components
      run: |
        sdkmanager --install "platform-tools"
        sdkmanager --install "platforms;android-${{ env.ANDROID_API_LEVEL }}"
        sdkmanager --install "build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}"
        sdkmanager --install "ndk;${{ env.ANDROID_NDK_VERSION }}"

    - name: Cache Qt
      id: cache-qt
      uses: actions/cache@v4
      with:
        path: ~/Qt
        key: ${{ runner.os }}-qt-${{ env.QT_VERSION }}-android-${{ matrix.abi }}

    - name: Install Qt for Android
      if: steps.cache-qt.outputs.cache-hit != 'true'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'android'
        arch: 'android_arm64_v8a'
        modules: 'qtmultimedia qtquick'
        cache: true

    - name: Cache OpenCV Android SDK
      id: cache-opencv
      uses: actions/cache@v4
      with:
        path: ~/Android/OpenCV-android-sdk
        key: ${{ runner.os }}-opencv-${{ env.OPENCV_VERSION }}-android

    - name: Download OpenCV Android SDK
      if: steps.cache-opencv.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/Android
        cd ~/Android
        wget -q https://github.com/opencv/opencv/releases/download/${{ env.OPENCV_VERSION }}/opencv-${{ env.OPENCV_VERSION }}-android-sdk.zip
        unzip -q opencv-${{ env.OPENCV_VERSION }}-android-sdk.zip
        mv OpenCV-android-sdk OpenCV-android-sdk || true

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.27.x'

    - name: Configure CMake for Android
      run: |
        mkdir -p build/android-${{ matrix.abi }}
        cd build/android-${{ matrix.abi }}
        cmake ../.. \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_SDK_ROOT/ndk/${{ env.ANDROID_NDK_VERSION }}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=${{ matrix.abi }} \
          -DANDROID_PLATFORM=android-${{ env.ANDROID_API_LEVEL }} \
          -DANDROID_NDK=$ANDROID_SDK_ROOT/ndk/${{ env.ANDROID_NDK_VERSION }} \
          -DANDROID_STL=c++_shared \
          -DQt6_DIR=~/Qt/${{ env.QT_VERSION }}/android_arm64_v8a/lib/cmake/Qt6 \
          -DOpenCV_DIR=~/Android/OpenCV-android-sdk/sdk/native/jni/abi-${{ matrix.abi }} \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH

    - name: Build Android APK
      run: |
        cd build/android-${{ matrix.abi }}
        cmake --build . -j$(nproc)

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk-${{ matrix.abi }}-${{ github.sha }}
        path: build/android-${{ matrix.abi }}/android-build/*.apk
        retention-days: 7

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ matrix.abi }}
        path: build/android-${{ matrix.abi }}/CMakeFiles/*.log
        retention-days: 3

  test-android:
    name: Test Android App
    needs: build-android
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [29, 33]
        abi: [arm64-v8a]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download APK artifact
      uses: actions/download-artifact@v4
      with:
        name: android-apk-${{ matrix.abi }}-${{ github.sha }}
        path: ./apk

    - name: Enable KVM for Android Emulator
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Setup Android Emulator and run tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.api-level }}
        arch: x86_64
        target: google_apis
        profile: pixel_6
        script: |
          adb wait-for-device
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          
          # Install APK
          adb install -r ./apk/*.apk
          
          # Wait for installation
          sleep 5
          
          # Launch app
          adb shell monkey -p com.example.file_transfer_ovimage -c android.intent.category.LAUNCHER 1
          
          # Wait for app to start
          sleep 10
          
          # Capture screenshot
          adb exec-out screencap -p > screenshot.png
          
          # Check if app is running
          adb shell pidof com.example.file_transfer_ovimage
          
          # Get logcat
          adb logcat -d > logcat.txt

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-api${{ matrix.api-level }}
        path: |
          screenshot.png
          logcat.txt
        retention-days: 3

  lint-and-analyze:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        cache: true

    - name: Install clang-tidy
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-tidy cppcheck

    - name: Run clang-tidy
      continue-on-error: true
      run: |
        mkdir -p build/lint
        cd build/lint
        cmake ../.. -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        clang-tidy ../src/**/*.cpp -- -I../../include

    - name: Run cppcheck
      continue-on-error: true
      run: |
        cppcheck --enable=all --inconclusive --xml --xml-version=2 \
          src/ include/ 2> cppcheck-report.xml

    - name: Upload code quality reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: code-quality-reports
        path: |
          cppcheck-report.xml
        retention-days: 7
