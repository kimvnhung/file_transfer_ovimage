name: Self-Healing Android CI

on:
  push:
    branches: [ main, dev_with_ai_agent ]
  pull_request:
    branches: [ main, dev_with_ai_agent ]
  workflow_dispatch:
    inputs:
      auto_fix:
        description: 'Attempt automatic fixes'
        required: false
        default: 'true'

env:
  QT_VERSION: '6.10.0'
  ANDROID_API_LEVEL: 23
  ANDROID_NDK_VERSION: '27.2.12479018'
  OPENCV_VERSION: '4.10.0'
  MAX_FIX_ATTEMPTS: 3

jobs:
  build-and-fix:
    name: Build with Auto-Fix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK components
      run: |
        sdkmanager --install "platform-tools"
        sdkmanager --install "platforms;android-${{ env.ANDROID_API_LEVEL }}"
        sdkmanager --install "build-tools;34.0.0"
        sdkmanager --install "ndk;${{ env.ANDROID_NDK_VERSION }}"

    - name: Cache Qt
      id: cache-qt
      uses: actions/cache@v4
      with:
        path: ~/Qt
        key: ${{ runner.os }}-qt-${{ env.QT_VERSION }}-android-${{ matrix.abi }}

    - name: Install Qt for Android
      if: steps.cache-qt.outputs.cache-hit != 'true'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'android'
        arch: 'android_arm64_v8a'
        modules: 'qtmultimedia qtquick'
        cache: true

    - name: Cache OpenCV Android SDK
      id: cache-opencv
      uses: actions/cache@v4
      with:
        path: ~/Android/OpenCV-android-sdk
        key: ${{ runner.os }}-opencv-${{ env.OPENCV_VERSION }}-android

    - name: Download OpenCV Android SDK
      if: steps.cache-opencv.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/Android
        cd ~/Android
        wget -q https://github.com/opencv/opencv/releases/download/${{ env.OPENCV_VERSION }}/opencv-${{ env.OPENCV_VERSION }}-android-sdk.zip
        unzip -q opencv-${{ env.OPENCV_VERSION }}-android-sdk.zip
        mv OpenCV-android-sdk OpenCV-android-sdk || true

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.27.x'

    - name: Build with Auto-Fix Loop
      id: build
      run: |
        BUILD_SUCCESS=false
        ATTEMPT=0
        MAX_ATTEMPTS=${{ env.MAX_FIX_ATTEMPTS }}
        
        while [ $ATTEMPT -lt $MAX_ATTEMPTS ] && [ "$BUILD_SUCCESS" = "false" ]; do
          ATTEMPT=$((ATTEMPT + 1))
          echo "::group::Build Attempt $ATTEMPT"
          echo "BUILD_ATTEMPT=$ATTEMPT" >> $GITHUB_ENV
          
          # Create build directory
          mkdir -p build/android-${{ matrix.abi }}
          cd build/android-${{ matrix.abi }}
          
          # Configure CMake
          echo "Configuring CMake..."
          cmake ../.. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_SDK_ROOT/ndk/${{ env.ANDROID_NDK_VERSION }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API_LEVEL }} \
            -DANDROID_NDK=$ANDROID_SDK_ROOT/ndk/${{ env.ANDROID_NDK_VERSION }} \
            -DANDROID_STL=c++_shared \
            -DQt6_DIR=~/Qt/${{ env.QT_VERSION }}/android_arm64_v8a/lib/cmake/Qt6 \
            -DOpenCV_DIR=~/Android/OpenCV-android-sdk/sdk/native/jni/abi-${{ matrix.abi }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            2>&1 | tee ../../cmake-log-$ATTEMPT.txt
          
          CMAKE_RESULT=${PIPESTATUS[0]}
          
          if [ $CMAKE_RESULT -ne 0 ]; then
            echo "CMAKE_FAILED=true" >> $GITHUB_ENV
            echo "CMake configuration failed on attempt $ATTEMPT"
            cd ../..
            # Analyze and fix
            bash .github/scripts/analyze-and-fix.sh cmake-log-$ATTEMPT.txt
            continue
          fi
          
          # Build
          echo "Building..."
          cmake --build . -j$(nproc) 2>&1 | tee ../../build-log-$ATTEMPT.txt
          
          BUILD_RESULT=${PIPESTATUS[0]}
          cd ../..
          
          if [ $BUILD_RESULT -eq 0 ]; then
            echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
            BUILD_SUCCESS=true
            echo "Build succeeded on attempt $ATTEMPT!"
          else
            echo "Build failed on attempt $ATTEMPT"
            # Analyze errors and attempt fixes
            bash .github/scripts/analyze-and-fix.sh build-log-$ATTEMPT.txt
          fi
          
          echo "::endgroup::"
        done
        
        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "BUILD_FAILED=true" >> $GITHUB_ENV
          echo "Build failed after $MAX_ATTEMPTS attempts"
          exit 1
        fi

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ matrix.abi }}-attempt-${{ env.BUILD_ATTEMPT }}
        path: |
          cmake-log-*.txt
          build-log-*.txt
          fix-log-*.txt
        retention-days: 7

    - name: Upload APK
      if: env.BUILD_SUCCESS == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: android-apk-${{ matrix.abi }}-${{ github.sha }}
        path: build/android-${{ matrix.abi }}/android-build/*.apk
        retention-days: 7

    - name: Create Issue for Build Failure
      if: failure() && env.BUILD_FAILED == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const attempt = process.env.BUILD_ATTEMPT || '1';
          
          let buildLog = '';
          try {
            buildLog = fs.readFileSync(`build-log-${attempt}.txt`, 'utf8');
          } catch (e) {
            buildLog = 'Log file not found';
          }
          
          const errors = buildLog.split('\n')
            .filter(line => line.includes('error:') || line.includes('Error:'))
            .slice(0, 20)
            .join('\n');
          
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `[Auto] Build failed after ${attempt} fix attempts - ${context.sha.substring(0, 7)}`,
            body: `## Build Failure Report
          
          **Commit:** ${context.sha}
          **Branch:** ${context.ref}
          **Attempts:** ${attempt}
          
          ### Errors Detected:
          \`\`\`
          ${errors}
          \`\`\`
          
          ### Full logs:
          See workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
          
          ### Suggested Actions:
          1. Review the error logs
          2. Check recent changes in this commit
          3. Verify dependencies are correctly installed
          4. Manual intervention may be required
          
          cc @${context.actor}`,
            labels: ['build-failure', 'automated']
          });

  test-android:
    name: Test on Emulator
    needs: build-and-fix
    if: needs.build-and-fix.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [29]
        abi: [arm64-v8a]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        name: android-apk-${{ matrix.abi }}-${{ github.sha }}
        path: ./apk

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run Tests on Emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.api-level }}
        arch: x86_64
        target: google_apis
        profile: pixel_6
        script: |
          set -e
          
          # Wait for device
          adb wait-for-device
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          
          # Install APK
          echo "Installing APK..."
          adb install -r ./apk/*.apk 2>&1 | tee install.log
          
          if ! grep -q "Success" install.log; then
            echo "Installation failed!"
            cat install.log
            exit 1
          fi
          
          sleep 3
          
          # Launch app
          echo "Launching app..."
          adb shell monkey -p com.example.file_transfer_ovimage -c android.intent.category.LAUNCHER 1
          
          sleep 10
          
          # Check if app is running
          if adb shell pidof com.example.file_transfer_ovimage > /dev/null; then
            echo "✓ App is running"
            echo "TEST_SUCCESS=true" >> $GITHUB_ENV
          else
            echo "✗ App failed to start"
            echo "TEST_FAILED=true" >> $GITHUB_ENV
          fi
          
          # Capture screenshot
          adb exec-out screencap -p > screenshot.png
          
          # Get logcat
          adb logcat -d > logcat.txt
          
          # Check for crashes
          if grep -qi "FATAL EXCEPTION\|AndroidRuntime" logcat.txt; then
            echo "✗ App crashed!"
            grep -A 20 "FATAL EXCEPTION\|AndroidRuntime" logcat.txt > crash.txt
            cat crash.txt
            echo "TEST_CRASHED=true" >> $GITHUB_ENV
            exit 1
          fi
          
          echo "✓ Tests completed"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-api${{ matrix.api-level }}
        path: |
          screenshot.png
          logcat.txt
          install.log
          crash.txt
        retention-days: 7

    - name: Create Issue for Test Failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          let crashLog = '';
          try {
            crashLog = fs.readFileSync('crash.txt', 'utf8');
          } catch (e) {
            crashLog = 'No crash log available';
          }
          
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `[Auto] Test failed on Android API ${{ matrix.api-level }} - ${context.sha.substring(0, 7)}`,
            body: `## Test Failure Report
          
          **Commit:** ${context.sha}
          **API Level:** ${{ matrix.api-level }}
          
          ### Crash Log:
          \`\`\`
          ${crashLog}
          \`\`\`
          
          ### Artifacts:
          - Screenshot: Check workflow artifacts
          - Full logcat: Check workflow artifacts
          
          cc @${context.actor}`,
            labels: ['test-failure', 'automated']
          });

  analyze-results:
    name: Analyze and Report
    needs: [build-and-fix, test-android]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate Summary Report
      uses: actions/github-script@v7
      with:
        script: |
          const buildResult = '${{ needs.build-and-fix.result }}';
          const testResult = '${{ needs.test-android.result }}';
          
          const emoji = {
            success: '✅',
            failure: '❌',
            skipped: '⏭️'
          };
          
          const summary = `
          ## 🤖 Self-Healing CI Summary
          
          ### Build Status: ${emoji[buildResult] || '❓'} ${buildResult.toUpperCase()}
          - Attempts: ${{ env.BUILD_ATTEMPT || '1' }}
          - Auto-fixes applied: ${process.env.BUILD_ATTEMPT > 1 ? 'Yes' : 'No'}
          
          ### Test Status: ${emoji[testResult] || '❓'} ${testResult.toUpperCase()}
          
          ### Workflow Details
          - Commit: \`${context.sha.substring(0, 7)}\`
          - Branch: \`${context.ref}\`
          - Actor: @${context.actor}
          - Run: [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
          
          ---
          *This is an automated report from the self-healing CI system*
          `;
          
          await core.summary
            .addRaw(summary)
            .write();
